<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&amp;family=IBM+Plex+Mono:wght@300;400&amp;display=swap');
      .bg        { fill: #0d1117; }
      .name      { font-family: 'Lora', Georgia, serif; font-size: 36px; font-weight: 400; fill: #e6edf3; letter-spacing: -0.5px; }
      .handle    { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 12px; font-weight: 300; fill: #484f58; letter-spacing: 0.04em; }
      .tagline   { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; font-weight: 300; fill: #6e7681; letter-spacing: 0.02em; }
      .label     { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 9.5px; font-weight: 300; fill: #484f58; letter-spacing: 0.1em; }
      .value     { font-family: 'Lora', Georgia, serif; font-size: 13.5px; font-style: italic; fill: #8b949e; }
      .mono      { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 12px; font-weight: 300; fill: #c9d1d9; letter-spacing: 0.02em; }
      .chip-text { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 10.5px; font-weight: 300; fill: #6e7681; letter-spacing: 0.03em; }
      .chip-text.hi { fill: #c9d1d9; }
      .rule      { stroke: #21262d; stroke-width: 0.5; }
    </style>
  </defs>

  <rect width="800" height="220" class="bg"/>

  <!-- left column -->
  <text x="48" y="82" class="name">Old</text>
  <text x="48" y="104" class="handle">@Old-cpu</text>
  <text x="48" y="122" class="tagline">still learning · always debugging</text>

  <!-- vertical rule -->
  <line x1="252" y1="32" x2="252" y2="188" class="rule"/>

  <!-- right column — label x=272, value x=358, row spacing=22px -->
  <text x="272" y="50"  class="label">NOW</text>

  <text x="272" y="72"  class="label">BUILDING</text>
  <text x="358" y="72"  class="value">intuitions for how compilers think</text>

  <text x="272" y="94"  class="label">STUDYING</text>
  <text x="358" y="94"  class="mono">MLIR · AI compiler · inference runtime</text>

  <text x="272" y="116" class="label">DRAWN TO</text>
  <text x="358" y="116" class="value">the gap between model and silicon</text>

  <text x="272" y="138" class="label">LOOKING FOR</text>
  <text x="358" y="138" class="value">open source projects to dig into</text>

  <text x="272" y="160" class="label">WEAPON</text>
  <text x="358" y="160" class="mono">console.log</text>

  <!-- bottom chips -->
  <line x1="272" y1="174" x2="752" y2="174" class="rule"/>

  <rect x="272" y="182" width="38" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="291" y="194" text-anchor="middle" class="chip-text hi">MLIR</text>

  <rect x="316" y="182" width="64" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="348" y="194" text-anchor="middle" class="chip-text hi">AI compiler</text>

  <rect x="386" y="182" width="80" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="426" y="194" text-anchor="middle" class="chip-text hi">AI inference</text>

  <rect x="472" y="182" width="38" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="491" y="194" text-anchor="middle" class="chip-text">LLVM</text>

  <rect x="516" y="182" width="30" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="531" y="194" text-anchor="middle" class="chip-text">C++</text>

  <rect x="552" y="182" width="62" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="583" y="194" text-anchor="middle" class="chip-text">open source</text>

  <rect x="620" y="182" width="46" height="17" rx="3" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <text x="643" y="194" text-anchor="middle" class="chip-text">systems</text>
</svg>
